<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Saya</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
        }

        nav {
            width: 200px;
            background-color: #e0f7fa;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        nav h3 {
            color: #00796b;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            margin-bottom: 10px;
        }

        nav a {
            text-decoration: none;
            color: #004d40;
            background-color: #b2dfdb;
            padding: 10px 15px;
            border-radius: 8px;
            display: block;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: #80cbc4;
        }

        main {
            flex: 1;
            padding: 20px;
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <nav>
        <h3>Menu</h3>
        <ul>
            <li><a href="profile.html" target="konten-frame">Profile</a></li>
            <li><a href="contact.html" target="konten-frame">Kontak</a></li>
        </ul>
    </nav>
    <main>
        <iframe name="konten-frame" src="profile.html"></iframe>
    </main>
</body>
</html>
